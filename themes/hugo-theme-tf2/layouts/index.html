{{ define "main" }}
  {{- $pages := where .Site.RegularPages "Type" "posts" }}
  {{- $sorted := sort $pages "Date" "desc" }}
  {{- range $sorted }}
    <div class="leftHR"><img src="{{ "images/hr.gif" | relURL }}" width="462" height="1" border="0"></div>
    <a href="{{ .Permalink }}" class="postLink">{{ .Title }}</a>
    <h2>{{ .Date.Format "January 2, 2006" }}{{ with .Params.author }} - {{ . }}{{ end }}</h2>
    <br>
    <p>
      {{ .Content }}
    </p>
    <br><br>
  {{- end }}
{{ end }}
