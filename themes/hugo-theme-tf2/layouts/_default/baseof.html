<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="darkreader-lock">
  <title>{{ $blogLabel := .Site.Params.blogLabel | default "Official Blog" }}{{ if or .IsHome (eq .Type "posts") }}{{ .Site.Title }} {{ $blogLabel }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
  <link rel="shortcut icon" href="{{ "images/favicon.ico" | relURL }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
  {{ end }}
</head>

<body>

  <div id="pageContainer">

    {{- partial "header.html" . -}}

    <div id="centerBG">

      {{- partial "sidebar.html" . -}}

      <div id="leftContainer">
        {{ block "main" . }}{{ end }}
      </div>

      <div class="clearfix"></div>
    </div>

    <div class="footerShadowTop"></div>
    {{- partial "footer.html" . -}}
    <div class="footerShadowBottom"></div>

  </div>

</body>
</html>
